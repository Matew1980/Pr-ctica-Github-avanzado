
name: CI DEVELOP

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar feature y actualizar README
        id: feature
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "feature_branch=" >> "$GITHUB_OUTPUT"

          # En un PR abierto o actualizado esperamos a la fusión.
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "Evento $EVENT_NAME: esperando a la integración en develop."
            exit 0
          fi

          # Obtener el mensaje del último commit.
          MESSAGE=$(git log -1 --pretty=%B)

          # Reconocer el formato habitual de un merge commit de GitHub.
          if [[ "$MESSAGE" =~ from[[:space:]]+[^/]+/(feature/[^[:space:]]+) ]]; then
            BRANCH="${BASH_REMATCH[1]}"
          else
            echo "No se ha identificado una feature en el último commit."
            echo "Usa Create a merge commit para que el nombre de la rama aparezca en el mensaje."
            exit 0
          fi

          echo "feature_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          LINE="Añadida feature: $BRANCH"

          if grep -Fxq "$LINE" README.md; then
            echo "La feature ya está registrada en README.md."
          else
            echo "$LINE" >> README.md
            echo "Feature registrada: $BRANCH"
          fi

      - name: Crear PR para guardar el README actualizado
        if: steps.feature.outputs.feature_branch != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: automation/update-readme
          delete-branch: true
          commit-message: "docs: registrar feature en README"
          title: "Actualizar README con la feature integrada"
          body: "Actualización automática del README tras integrar una feature en develop."
          add-paths: README.md

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar token de desarrollo
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
            Write-Error "La variable local LOCAL_DEV_TOKEN no está disponible."
            exit 1
          }

          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            Write-Error "El secreto DEV_TOKEN no está disponible."
            exit 1
          }

          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Output "CORRECTO: Los tokens coinciden."
          }
          else {
            Write-Error "ERROR: Los tokens no coinciden."
            exit 1
          }
