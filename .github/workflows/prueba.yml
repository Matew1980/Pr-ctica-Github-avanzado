
name: Prueba self-hosted runner y secrets

on:
  push:

jobs:
  comprobar-token:
    runs-on: self-hosted

    steps:
      - name: Comparar token de desarrollo
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Output "CORRECTO: Los tokens coinciden."
          } else {
            Write-Output "ERROR: Los tokens no coinciden."
            exit 1
          }
