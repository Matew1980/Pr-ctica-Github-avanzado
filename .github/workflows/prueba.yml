
name: Prueba self-hosted runner y secrets
#otra prubea para lograr que el runner funcione 
on:
  push:

jobs:
  comprobar-token:
    runs-on: self-hosted

    steps:
      - name: Comprobar variable local
        shell: cmd
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if not defined LOCAL_DEV_TOKEN (
            echo ERROR: La variable local no esta disponible.
            exit /b 1
          )
          echo CORRECTO: La variable local esta disponible.
          if "%DEV_TOKEN%"=="%LOCAL_DEV_TOKEN%" (
            echo CORRECTO: Los tokens coinciden.
          ) else (
            echo ERROR: Los tokens no coinciden.
            exit /b 1
          )
